ServerRoot "C:/xampp/apache"
PidFile "logs/kayan-erp-httpd.pid"

# Core Modules
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule log_config_module modules/mod_log_config.so

# Proxy & Load Balancer Modules
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so

# Windows Multi-Processing Module (MPM) Fine Tuning
# Handles up to 150 concurrent worker threads on Windows
<IfModule mpm_winnt_module>
    ThreadsPerChild 150
    MaxConnectionsPerChild 0
</IfModule>

Listen 0.0.0.0:8000

ServerName localhost:8000
DocumentRoot "C:/Users/PC/Projects/kayan-erp-live/public"

# Gzip / Deflate Compression for CSS, JS, Fonts, SVG, JSON
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2
</IfModule>

# Browser Caching Headers for instant 0ms reload
<IfModule mod_headers.c>
    <LocationMatch "^/(build|fonts|images)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(sw\.js|manifest\.json)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </LocationMatch>
</IfModule>

# MIME types
<IfModule mod_mime.c>
    TypesConfig conf/mime.types
    AddType text/css .css
    AddType application/javascript .js
    AddType font/woff2 .woff2
    AddType font/woff .woff
    AddType image/svg+xml .svg
    AddType application/manifest+json .json
</IfModule>

# Load Balancer to PHP backend cluster (4 parallel PHP workers)
<Proxy "balancer://phpcluster">
    BalancerMember "http://127.0.0.1:8001" retry=1 timeout=60
    BalancerMember "http://127.0.0.1:8002" retry=1 timeout=60
    BalancerMember "http://127.0.0.1:8003" retry=1 timeout=60
    BalancerMember "http://127.0.0.1:8004" retry=1 timeout=60
    ProxySet lbmethod=byrequests
</Proxy>

<Directory "C:/Users/PC/Projects/kayan-erp-live/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Disable DirectoryIndex so Apache does not append index.html to '/'
    DirectoryIndex disabled

    RewriteEngine On

    # 1. Block access to hidden files
    RewriteRule ^/\. - [F]

    # 2. If the request is for an existing static file (CSS, JS, images, fonts - NEVER .php), serve it directly!
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteCond %{REQUEST_URI} !\.php$
    RewriteRule ^ - [L]

    # 3. Otherwise, forward all routes and requests to the PHP cluster
    RewriteRule ^(.*)$ balancer://phpcluster/$1 [P,L]
</Directory>

# Preserve original Host and Client IP for Laravel
ProxyPreserveHost On
ProxyTimeout 120
RequestHeader set X-Forwarded-Proto "http"
RequestHeader set X-Forwarded-Port "8000"

ErrorLog "logs/kayan-erp-error.log"
LogLevel warn
