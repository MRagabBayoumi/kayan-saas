# ==============================================================================
# Kayan ERP - Hardened Nginx Production Configuration
# Blocks RCE probes, PHP-CGI arguments injection, and enforces strict security
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/kayan-erp/public;

    index index.php index.html;
    charset utf-8;

    # 1. Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # 2. Block PHP-CGI Argument Injection Exploits (CVE-2024-4577 Mitigation)
    if ($query_string ~* "(^|&)-[dswb]") {
        return 400;
    }
    if ($query_string ~* "auto_prepend_file|allow_url_include|php://input") {
        return 400;
    }

    # 3. Request Payload & Upload Limits
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # 4. Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 5. FastCGI PHP Execution with Safe Buffers
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Protect against buffer overflow & OOM attacks
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # 6. Block Access to Hidden & Sensitive Files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(storage|bootstrap/cache)/.*\.php$ {
        deny all;
    }

    location ~ ^/(vendor|app|config|database|routes)/ {
        deny all;
    }
}
