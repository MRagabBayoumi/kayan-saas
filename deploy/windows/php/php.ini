; ==============================================================================
; Kayan ERP - Hardened Production PHP Configuration (Zero Vulnerabilities)
; Specifically tuned to neutralize RCE, CGI parameter injections & memory flaws
; ==============================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

; 1. Information Disclosure Protection
expose_php = Off

; 2. Resource Limits & Denial of Service (DoS) Protection
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 20

; 3. Error Handling (Strictly Logged, Never Shown to End-Users)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
error_log = "C:/KayanERP/server/php/php_errors.log"

; 4. Execution Hardening & Dangerous Functions Neutralization
; Disables high-risk functions commonly targeted by RCE payloads
disable_functions = exec,passthru,shell_exec,system,popen,show_source,highlight_file,dl

; 5. Remote File Inclusion (RFI) & Stream Injection Protection
allow_url_fopen = On
allow_url_include = Off
auto_globals_jit = On

; 6. CGI Parameter Injection Mitigation (CVE-2024-4577 Hardening)
cgi.force_redirect = 1
cgi.fix_pathinfo = 0

; 7. Extensions Directory & Required Modules for Kayan ERP
extension_dir = "ext"
extension=bcmath
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=zip

; 8. Timezone Configuration
[Date]
date.timezone = "Africa/Cairo"

; 9. Session Security & Cookie Protection
[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = KAYAN_SESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 7200

; 10. OPcache Performance & File Protection
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 1
