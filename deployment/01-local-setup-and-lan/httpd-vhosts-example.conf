# ========================================================
# Kayan ERP - Apache VirtualHost Configuration Example
# مسار الملف في خادم XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# ========================================================

<VirtualHost *:80>
    # ضع هنا عنوان IP الثابت لجهاز السيرفر الرئيسي على الشبكة المحلية
    ServerName 192.168.1.100
    ServerAlias kayan.local localhost

    # المسار المطلق لمجلد public في المشروع
    DocumentRoot "C:/xampp/htdocs/kayan-erp/public"

    <Directory "C:/xampp/htdocs/kayan-erp/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # سجلات الأخطاء والزيارات
    ErrorLog "logs/kayan-erp-error.log"
    CustomLog "logs/kayan-erp-access.log" combined
</VirtualHost>
