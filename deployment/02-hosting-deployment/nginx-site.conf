# ========================================================
# Kayan ERP - Nginx Production Server Block
# المسار في السيرفر: /etc/nginx/sites-available/kayan-erp
# ========================================================

server {
    listen 80;
    listen [::]:80;

    # استبدل بالدومين الفعلي للعميل
    server_name erp.yourdomain.com;

    # المسار المباشر لمجلد public داخل مجلد المشروع
    root /var/www/kayan-erp/public;

    index index.php index.html;
    charset utf-8;

    # حماية الهيدرز
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # أقصى حجم لرفع الملفات (مثلاً ملفات إكسيل وفواتير حتى 25 ميجا)
    client_max_body_size 25M;

    # توجيه الطلبات لـ Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # معالجة أيقونة الموقع وملف robots.txt بدون تسجيل
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # صفحات الأخطاء
    error_page 404 /index.php;

    # معالجة ملفات PHP عبر PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # التخزين المؤقت للملفات الثابتة (أصول Vite والصور والخطوط)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # منع الوصول المباشر للملفات الحساسة وملفات الإعدادات المخفية
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
