# =======================================================================
# KAYAN ERP - Apache VirtualHost Configuration for XAMPP
# File Location: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# =======================================================================
# 
# Instructions:
# 1. Open C:\xampp\apache\conf\extra\httpd-vhosts.conf
# 2. Paste the block below at the end of the file.
# 3. Replace '192.168.1.100' with your actual Server IP.
# 4. In C:\xampp\apache\conf\httpd.conf, make sure this line is enabled:
#       Include conf/extra/httpd-vhosts.conf
# 5. Restart Apache from XAMPP Control Panel.
# =======================================================================

<VirtualHost *:80>
    # Server IP or Hostname on the Local Network
    ServerName 192.168.1.100
    ServerAlias kayan.local localhost 127.0.0.1

    # Absolute path to the Laravel public directory
    DocumentRoot "C:/xampp/htdocs/kayan-erp/public"

    <Directory "C:/xampp/htdocs/kayan-erp/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Log files
    ErrorLog "logs/kayan-erp-error.log"
    CustomLog "logs/kayan-erp-access.log" combined
</VirtualHost>
